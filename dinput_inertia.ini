[Inertia]
; Mouse wheel inertia settings for Ground Control II
;
; Enabled: 1 = on, 0 = off
Enabled=1

; DecayRate: How fast the scroll momentum decays (1-100)
;   1 = very slow decay (long glide)
;   50 = medium decay (balanced)
;   100 = fast decay (quick stop)
DecayRate=80

; Multiplier: Velocity boost from each scroll tick (1-500)
;   Higher = faster zoom per wheel tick
;   100 = ~6-7 zoom steps per tick, 200 = ~13 steps
Multiplier=200

; InjectInterval: Milliseconds between zoom key presses (0-500)
;   Lower = faster/smoother zoom
;   Higher = slower zoom steps
InjectInterval=4

; ReverseWheel: Reverse scroll direction (0 or 1)
;   1 = scroll away to zoom in, like Starcraft 2 (default)
;   0 = original game behavior
ReverseWheel=1
